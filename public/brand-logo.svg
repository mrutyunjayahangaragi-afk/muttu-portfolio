<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Monogram Icon Background -->
  <rect x="10" y="15" width="70" height="70" rx="20" fill="#0A0F1D" stroke="url(#brand-grad)" stroke-width="2.5" />
  
  <!-- Code Bracket & AI Node Symbol -->
  <path d="M 28 40 L 20 50 L 28 60" fill="none" stroke="url(#brand-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 62 40 L 70 50 L 62 60" fill="none" stroke="url(#brand-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="45" cy="50" r="4" fill="url(#brand-grad)" filter="url(#glow)" />
  <path d="M 45 34 L 45 40 M 45 60 L 45 66 M 29 50 L 35 50 M 55 50 L 61 50" stroke="url(#brand-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Wordmark Text -->
  <text x="100" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#FFFFFF" letter-spacing="-0.5">
    DEV<tspan fill="url(#brand-grad)">&lt;PORTFOLIO/&gt;</tspan>
  </text>
  <text x="102" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="2">
    CSE • FULL-STACK &amp; AI DEVELOPER
  </text>
</svg>
