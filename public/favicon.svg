<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Surface Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#050810" stroke="url(#fav-grad)" stroke-width="16" />
  
  <!-- Code Brackets & Core AI Node -->
  <path d="M 160 192 L 112 256 L 160 320" fill="none" stroke="url(#fav-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 352 192 L 400 256 L 352 320" fill="none" stroke="url(#fav-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Core AI Sparkle Node -->
  <circle cx="256" cy="256" r="28" fill="url(#fav-grad)" filter="url(#fav-glow)" />
  <path d="M 256 160 L 256 200 M 256 312 L 256 352 M 160 256 L 200 256 M 312 256 L 352 256" stroke="url(#fav-grad)" stroke-width="14" stroke-linecap="round" />
</svg>
